; ============================================================================
; Supervisor program — Tawfeer Online queue worker (production).
; Place at: /etc/supervisord.d/tawfeer-worker.ini  (AlmaLinux uses /etc/supervisord.d/*.ini)
; Then:  supervisorctl reread && supervisorctl update && supervisorctl start tawfeer-worker:*
;
; Replace <USER> and <APP_PATH> with the real deploy account and path
; (e.g. USER=tawfeer, APP_PATH=/home/tawfeer/app or the cPanel doc-root's parent).
; Requires QUEUE_CONNECTION=redis in .env. Runs the queued marketing sends
; (SendCampaignMessageJob) and any future queued jobs.
; ============================================================================
[program:tawfeer-worker]
process_name=%(program_name)s_%(process_num)02d
command=php <APP_PATH>/artisan queue:work redis --queue=default --sleep=3 --tries=3 --max-time=3600 --backoff=10
directory=<APP_PATH>
autostart=true
autorestart=true
user=<USER>
numprocs=2
redirect_stderr=true
stdout_logfile=<APP_PATH>/storage/logs/worker.log
stopwaitsecs=3600
stopasgroup=true
killasgroup=true

; After every deploy that changes code, restart workers so they load new code:
;   php <APP_PATH>/artisan queue:restart
