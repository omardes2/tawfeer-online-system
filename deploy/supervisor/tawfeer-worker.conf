; ============================================================================
; Tawfeer Online — Supervisor queue workers.
; Ubuntu 24.04: rendered by provision.sh -> /etc/supervisor/conf.d/tawfeer-worker.conf
; (On AlmaLinux/cPanel place at /etc/supervisord.d/tawfeer-worker.ini instead.)
; Placeholders <DEPLOY_USER>, <APP_PATH>, <WORKER_PROCS> are substituted at provision.
;
; Requires QUEUE_CONNECTION=redis in .env. Runs queued jobs (e.g. marketing
; SendCampaignMessageJob). After every code deploy run `php artisan queue:restart`
; (deploy.sh/update.sh do this) so workers gracefully reload new code.
;
; Manage:  supervisorctl reread && supervisorctl update
;          supervisorctl status tawfeer-worker:*
;          supervisorctl restart tawfeer-worker:*
; ============================================================================
[program:tawfeer-worker]
process_name=%(program_name)s_%(process_num)02d
command=php <APP_PATH>/artisan queue:work redis --queue=default --sleep=3 --tries=3 --max-time=3600 --backoff=10
directory=<APP_PATH>
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=<DEPLOY_USER>
numprocs=<WORKER_PROCS>
redirect_stderr=true
stdout_logfile=<APP_PATH>/storage/logs/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=3600
