; ============================================================================
; Tawfeer Online — dedicated PHP-FPM pool (Ubuntu 24.04).
; Rendered by provision.sh -> /etc/php/<PHP_VERSION>/fpm/pool.d/tawfeer.conf
; Runs as the deploy user so the app can write storage/; the socket is group
; www-data so Nginx can reach it.
; ============================================================================
[tawfeer]
user = <DEPLOY_USER>
group = <DEPLOY_USER>

listen = /run/php/tawfeer-<PHP_VERSION>-fpm.sock
listen.owner = <DEPLOY_USER>
listen.group = www-data
listen.mode = 0660

; Dynamic process manager — tune to your VPS RAM.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Recycle workers & surface slow requests
request_terminate_timeout = 60s
pm.status_path = /fpm-status
ping.path = /fpm-ping

; Per-pool php overrides (production)
php_admin_value[error_log] = <APP_PATH>/storage/logs/php-fpm.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 512M
catch_workers_output = yes
