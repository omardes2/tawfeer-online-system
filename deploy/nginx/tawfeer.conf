# ============================================================================
# Tawfeer Online — Nginx virtual host (Ubuntu 24.04).
# Rendered by provision.sh -> /etc/nginx/sites-available/tawfeer.conf
# Placeholders (<DOMAIN>, <APP_PATH>, <PHP_VERSION>) are substituted at provision.
#
# HTTPS: run `certbot --nginx -d <DOMAIN>` after DNS resolves — Certbot injects
# the `listen 443 ssl` block, cert paths, and the HTTP->HTTPS redirect into
# this file automatically. This block is written SSL-ready (HTTP first boot).
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN> <DOMAIN_ALIASES>;

    root <APP_PATH>/public;
    index index.php;

    charset utf-8;
    client_max_body_size 25M;

    # --- Security headers (HSTS is added by Certbot with the TLS block) ------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # --- Gzip ---------------------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml image/svg+xml font/ttf font/otf
               application/vnd.ms-fontobject;

    # --- Laravel front controller -------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # --- Long-cache built/static assets -------------------------------------
    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
        access_log off;
    }

    # --- PHP-FPM ------------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/tawfeer-<PHP_VERSION>-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    # --- Deny access to hidden files & sensitive paths ----------------------
    location ~ /\.(?!well-known).* { deny all; }
    location ~ ^/(?:\.env|composer\.(?:json|lock)|package(?:-lock)?\.json|artisan)$ { deny all; }

    error_log  /var/log/nginx/tawfeer_error.log;
    access_log /var/log/nginx/tawfeer_access.log;
}
